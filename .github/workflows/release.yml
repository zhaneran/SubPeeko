name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/subpeeko
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.x"

      - name: Install build tools
        run: python -m pip install --upgrade pip build twine

      - name: Verify tag and package versions match
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          with open("pyproject.toml", "rb") as source:
              version = tomllib.load(source)["project"]["version"]
          expected = f"v{version}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(f"tag {actual!r} does not match package version {expected!r}")
          PY

      - name: Install package and check dependencies
        run: |
          python -m pip install .
          python -m pip check

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build distributions
        run: python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Prepare release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          version = os.environ["RELEASE_TAG"].removeprefix("v")
          lines = Path("RELEASES.md").read_text(encoding="utf-8").splitlines(keepends=True)
          heading = f"## {version} "
          try:
              start = next(index for index, line in enumerate(lines) if line.startswith(heading))
          except StopIteration as exc:
              raise SystemExit(f"RELEASES.md has no section for {version}") from exc
          end = next((index for index in range(start + 1, len(lines)) if lines[index].startswith("## ")), len(lines))
          Path("release-notes.md").write_text("".join(lines[start:end]).strip() + "\n", encoding="utf-8")
          PY

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/* --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
